apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-demo
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-demo
  template:
    metadata:
      labels:
        app: flask-demo
    spec:
      containers:
      - name: flask-demo
        image: be11a/flask-demo:v1
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-demo-svc
spec:
  selector:
    app: flask-demo
  ports:
  - port: 80
    targetPort: 5000
  type: ClusterIP
